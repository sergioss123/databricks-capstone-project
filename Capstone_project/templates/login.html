{% extends "base.html" %}

{% block title %}Login - AI Research Assistant{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 50px auto;">
    <div class="card">
        <h2 style="color: #667eea; margin-bottom: 20px; text-align: center;">
            👋 Welcome to AI Research Assistant
        </h2>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">
            Select your account or create a new one to get started
        </p>

        <!-- Existing Users List -->
        <div class="form-group">
            <label>Select Existing User</label>
            <select id="userSelect" class="form-control">
                <option value="">-- Choose a user --</option>
                {% for user in users %}
                <option value="{{ user.id }}">{{ user.name }} ({{ user.email }})</option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn-primary" style="width: 100%; margin-bottom: 20px;" 
                onclick="loginUser()">
            Login as Selected User
        </button>

        <div style="text-align: center; margin: 20px 0; color: #999;">
            <hr style="border: none; border-top: 1px solid #e0e0e0;">
            <span style="background: white; padding: 0 10px; position: relative; top: -12px;">OR</span>
        </div>

        <!-- New User Form -->
        <div id="newUserForm" class="hidden">
            <h3 style="margin-bottom: 20px;">Create New Account</h3>
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="newUserName" class="form-control" 
                       placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="newUserEmail" class="form-control" 
                       placeholder="Enter your email" required>
            </div>
            <button class="btn btn-primary" style="width: 100%;" 
                    onclick="createUser()">
                Create Account & Continue
            </button>
            <button class="btn btn-secondary" style="width: 100%; margin-top: 10px;" 
                    onclick="toggleNewUserForm()">
                Cancel
            </button>
        </div>

        <button id="showNewUserBtn" class="btn btn-secondary" 
                style="width: 100%;" onclick="toggleNewUserForm()">
            + Create New User
        </button>

        <div id="loadingSpinner" class="spinner hidden"></div>
    </div>
</div>

<script>
function toggleNewUserForm() {
    const form = document.getElementById('newUserForm');
    const btn = document.getElementById('showNewUserBtn');
    
    if (form.classList.contains('hidden')) {
        form.classList.remove('hidden');
        btn.classList.add('hidden');
    } else {
        form.classList.add('hidden');
        btn.classList.remove('hidden');
    }
}

function loginUser() {
    const userId = document.getElementById('userSelect').value;
    if (!userId) {
        alert('Please select a user');
        return;
    }
    
    showSpinner('loadingSpinner');
    
    fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ user_id: userId })
    })
    .then(resp => resp.json())
    .then(data => {
        if (data.success) {
            window.location.href = '/dashboard';
        } else {
            alert(data.error || 'Login failed');
            hideSpinner('loadingSpinner');
        }
    })
    .catch(err => {
        console.error(err);
        alert('Login failed');
        hideSpinner('loadingSpinner');
    });
}

function createUser() {
    const name = document.getElementById('newUserName').value.trim();
    const email = document.getElementById('newUserEmail').value.trim();
    
    if (!name || !email) {
        alert('Please fill in all fields');
        return;
    }
    
    showSpinner('loadingSpinner');
    
    fetch('/api/users', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, email })
    })
    .then(resp => resp.json())
    .then(data => {
        if (data.success) {
            // Redirect to initialization page
            window.location.href = '/initialize?user_id=' + data.user_id;
        } else {
            alert(data.error || 'Failed to create user');
            hideSpinner('loadingSpinner');
        }
    })
    .catch(err => {
        console.error(err);
        alert('Failed to create user');
        hideSpinner('loadingSpinner');
    });
}
</script>
{% endblock %}
